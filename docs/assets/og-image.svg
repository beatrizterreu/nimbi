<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1E1840"/>
      <stop offset="100%" stop-color="#0D0B14"/>
    </radialGradient>
    <radialGradient id="mg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A95C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#E8A95C" stop-opacity="0"/>
    </radialGradient>
    <mask id="cm">
      <circle cx="180" cy="200" r="120" fill="white"/>
      <circle cx="228" cy="165" r="105" fill="black"/>
    </mask>
    <radialGradient id="mf" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF0C0"/>
      <stop offset="60%" stop-color="#F5D87A"/>
      <stop offset="100%" stop-color="#E8A95C"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Stars -->
  <circle cx="100" cy="60"  r="2.5" fill="#F5E6A0" opacity="0.9"/>
  <circle cx="350" cy="40"  r="2.0" fill="#FFFFFF"  opacity="0.8"/>
  <circle cx="580" cy="70"  r="1.8" fill="#C8C0E8" opacity="0.85"/>
  <circle cx="750" cy="35"  r="2.2" fill="#F5E6A0" opacity="0.75"/>
  <circle cx="950" cy="55"  r="1.6" fill="#FFFFFF"  opacity="0.80"/>
  <circle cx="1100" cy="45" r="2.0" fill="#C8C0E8" opacity="0.70"/>
  <circle cx="1180" cy="90" r="1.4" fill="#F5E6A0" opacity="0.65"/>
  <circle cx="60"  cy="180" r="1.5" fill="#C8C0E8" opacity="0.60"/>
  <circle cx="1150" cy="200" r="1.8" fill="#F5E6A0" opacity="0.55"/>
  <circle cx="1190" cy="380" r="1.5" fill="#C8C0E8" opacity="0.50"/>
  <circle cx="40"  cy="500" r="1.8" fill="#F5E6A0" opacity="0.48"/>
  <circle cx="420" cy="580" r="1.5" fill="#FFFFFF"  opacity="0.42"/>
  <circle cx="900" cy="590" r="1.8" fill="#C8C0E8" opacity="0.40"/>

  <!-- Sparkle stars -->
  <g transform="translate(650,45)" filter="url(#glow)" opacity="0.80">
    <line x1="0" y1="-8" x2="0" y2="8"  stroke="#F5E6A0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-8" y1="0" x2="8" y2="0"  stroke="#F5E6A0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-4" y1="-4" x2="4" y2="4" stroke="#F5E6A0" stroke-width="0.6" stroke-linecap="round"/>
    <line x1="4" y1="-4" x2="-4" y2="4" stroke="#F5E6A0" stroke-width="0.6" stroke-linecap="round"/>
  </g>
  <g transform="translate(1050,100)" opacity="0.65">
    <line x1="0" y1="-6" x2="0" y2="6"  stroke="#C8C0E8" stroke-width="1.0" stroke-linecap="round"/>
    <line x1="-6" y1="0" x2="6" y2="0"  stroke="#C8C0E8" stroke-width="1.0" stroke-linecap="round"/>
  </g>

  <!-- Moon glow -->
  <circle cx="180" cy="200" r="220" fill="url(#mg)"/>
  <!-- Moon -->
  <circle cx="180" cy="200" r="120" fill="url(#mf)" mask="url(#cm)" filter="url(#glow)"/>

  <!-- Center text block -->
  <!-- Logo area -->
  <text x="600" y="225" text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="86" font-weight="600" letter-spacing="4"
        fill="#F0EDE6">nimbi</text>

  <!-- Moon symbol next to logo -->
  <text x="470" y="222" text-anchor="middle"
        font-family="-apple-system, sans-serif"
        font-size="54" fill="#E8A95C" opacity="0.9">🌙</text>

  <!-- Tagline -->
  <text x="600" y="285" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" font-weight="400" letter-spacing="0.5"
        fill="#B8B0A8">Personalized AI bedtime stories for children</text>

  <!-- Bottom divider line -->
  <line x1="430" y1="345" x2="770" y2="345" stroke="#2A2640" stroke-width="1"/>

  <!-- Bottom tags -->
  <text x="600" y="390" text-anchor="middle"
        font-family="-apple-system, sans-serif"
        font-size="20" fill="#7A7087" letter-spacing="3">CALM  ·  PERSONAL  ·  SAFE</text>

  <!-- App Store badge placeholder -->
  <rect x="480" y="430" width="240" height="60" rx="14" fill="#1E1B36" stroke="#2A2640" stroke-width="1.5"/>
  <text x="600" y="455" text-anchor="middle" fill="#9E98A8" font-family="-apple-system, sans-serif" font-size="11" letter-spacing="1">DOWNLOAD ON THE</text>
  <text x="600" y="477" text-anchor="middle" fill="#F0EDE6" font-family="-apple-system, sans-serif" font-size="20" font-weight="600">App Store</text>

  <!-- Corner decorations -->
  <circle cx="1160" cy="580" r="60" fill="#1A1538" opacity="0.4"/>
  <circle cx="40"   cy="600" r="45" fill="#1A1538" opacity="0.3"/>
</svg>
