<svg viewBox="0 0 160 40" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nimbi">
  <defs>
    <mask id="crescent">
      <circle cx="13" cy="20" r="10" fill="white"/>
      <circle cx="17.5" cy="16.5" r="8.5" fill="black"/>
    </mask>
    <radialGradient id="moon-shine" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F5E6A0"/>
      <stop offset="100%" stop-color="#E8A95C"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Crescent moon -->
  <circle cx="13" cy="20" r="10" fill="url(#moon-shine)" mask="url(#crescent)" filter="url(#soft-glow)"/>

  <!-- Tiny star near moon -->
  <circle cx="26" cy="13" r="1.1" fill="#F5E6A0" opacity="0.9"/>
  <circle cx="30" cy="9" r="0.7" fill="#C8C0E8" opacity="0.7"/>

  <!-- Wordmark: nimbi -->
  <text
    x="36"
    y="26"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="20"
    font-weight="600"
    letter-spacing="0.5"
    fill="#F0EDE6">nimbi</text>
</svg>
