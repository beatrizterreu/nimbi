<svg viewBox="0 0 56 56" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow-c" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8C0E8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8C0E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moon-c" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF0C0"/>
      <stop offset="100%" stop-color="#E8A95C"/>
    </radialGradient>
    <mask id="crescent-c">
      <circle cx="26" cy="27" r="13" fill="white"/>
      <circle cx="31" cy="23" r="11" fill="black"/>
    </mask>
  </defs>
  <circle cx="28" cy="28" r="28" fill="url(#glow-c)"/>
  <!-- Moon -->
  <circle cx="26" cy="27" r="13" fill="url(#moon-c)" mask="url(#crescent-c)"/>
  <!-- Stars around moon -->
  <circle cx="40" cy="18" r="1.8" fill="#F5E6A0" opacity="0.9"/>
  <circle cx="44" cy="28" r="1.2" fill="#C8C0E8" opacity="0.8"/>
  <circle cx="38" cy="12" r="1.0" fill="#F5E6A0" opacity="0.7"/>
  <circle cx="44" cy="38" r="1.0" fill="#C8C0E8" opacity="0.6"/>
  <!-- Zzz calm indicator -->
  <text x="39" y="42" fill="#C8C0E8" font-family="-apple-system, sans-serif" font-size="9" opacity="0.7">z</text>
  <text x="43" y="37" fill="#C8C0E8" font-family="-apple-system, sans-serif" font-size="7" opacity="0.5">z</text>
</svg>
