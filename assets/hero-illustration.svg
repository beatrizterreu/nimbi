<svg viewBox="0 0 560 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Nimbi app on a phone against a starry night sky">
  <defs>
    <!-- Sky gradient -->
    <radialGradient id="sky" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E1840"/>
      <stop offset="60%" stop-color="#100D22"/>
      <stop offset="100%" stop-color="#0D0B14"/>
    </radialGradient>

    <!-- Moon glow -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8A95C" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#E8A95C" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#E8A95C" stop-opacity="0"/>
    </radialGradient>

    <!-- Moon face gradient -->
    <radialGradient id="moonFace" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#FFF0C0"/>
      <stop offset="50%" stop-color="#F5D87A"/>
      <stop offset="100%" stop-color="#E8A95C"/>
    </radialGradient>

    <!-- Moon crescent mask -->
    <mask id="crescentMask">
      <circle cx="95" cy="115" r="72" fill="white"/>
      <circle cx="127" cy="93" r="63" fill="black"/>
    </mask>

    <!-- Phone ambient glow -->
    <radialGradient id="phoneGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C8C0E8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#C8C0E8" stop-opacity="0"/>
    </radialGradient>

    <!-- Screen bottom fade -->
    <linearGradient id="screenFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0B14" stop-opacity="0"/>
      <stop offset="70%" stop-color="#0D0B14" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0D0B14" stop-opacity="1"/>
    </linearGradient>

    <!-- Nebula glow 1 -->
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3A1A5C" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3A1A5C" stop-opacity="0"/>
    </radialGradient>

    <!-- Nebula glow 2 -->
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1A2A5C" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1A2A5C" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="screenClip">
      <rect x="172" y="142" width="216" height="456" rx="24"/>
    </clipPath>
  </defs>

  <!-- Background sky -->
  <rect width="560" height="660" fill="url(#sky)"/>

  <!-- Nebula clouds -->
  <ellipse cx="420" cy="200" rx="180" ry="130" fill="url(#nebula1)"/>
  <ellipse cx="140" cy="450" rx="150" ry="100" fill="url(#nebula2)"/>
  <ellipse cx="480" cy="520" rx="120" ry="90" fill="url(#nebula1)" opacity="0.6"/>

  <!-- Stars — scattered field -->
  <!-- Large/bright stars -->
  <circle cx="48"  cy="48"  r="1.8" fill="#F5E6A0" opacity="0.95"/>
  <circle cx="200" cy="32"  r="1.5" fill="#FFFFFF"  opacity="0.90"/>
  <circle cx="380" cy="55"  r="2.0" fill="#F5E6A0" opacity="0.85"/>
  <circle cx="490" cy="30"  r="1.6" fill="#FFFFFF"  opacity="0.88"/>
  <circle cx="520" cy="140" r="1.4" fill="#C8C0E8" opacity="0.80"/>
  <circle cx="440" cy="85"  r="1.8" fill="#F5E6A0" opacity="0.75"/>
  <circle cx="310" cy="70"  r="1.3" fill="#FFFFFF"  opacity="0.85"/>
  <circle cx="60"  cy="170" r="1.5" fill="#C8C0E8" opacity="0.70"/>
  <circle cx="28"  cy="310" r="1.2" fill="#FFFFFF"  opacity="0.65"/>
  <circle cx="42"  cy="400" r="1.6" fill="#F5E6A0" opacity="0.60"/>
  <circle cx="500" cy="310" r="1.4" fill="#C8C0E8" opacity="0.72"/>
  <circle cx="530" cy="390" r="1.8" fill="#FFFFFF"  opacity="0.68"/>
  <circle cx="30"  cy="540" r="1.3" fill="#F5E6A0" opacity="0.55"/>
  <circle cx="520" cy="580" r="1.5" fill="#C8C0E8" opacity="0.60"/>
  <circle cx="250" cy="620" r="1.2" fill="#FFFFFF"  opacity="0.50"/>
  <circle cx="480" cy="640" r="1.6" fill="#F5E6A0" opacity="0.48"/>

  <!-- Medium stars -->
  <circle cx="160" cy="62"  r="1.0" fill="#FFFFFF"  opacity="0.75"/>
  <circle cx="265" cy="42"  r="0.9" fill="#C8C0E8" opacity="0.80"/>
  <circle cx="340" cy="28"  r="1.1" fill="#FFFFFF"  opacity="0.70"/>
  <circle cx="450" cy="52"  r="0.8" fill="#F5E6A0" opacity="0.65"/>
  <circle cx="505" cy="95"  r="1.0" fill="#FFFFFF"  opacity="0.72"/>
  <circle cx="78"  cy="95"  r="0.9" fill="#C8C0E8" opacity="0.68"/>
  <circle cx="32"  cy="228" r="1.0" fill="#FFFFFF"  opacity="0.60"/>
  <circle cx="514" cy="220" r="0.9" fill="#F5E6A0" opacity="0.65"/>
  <circle cx="540" cy="290" r="0.8" fill="#C8C0E8" opacity="0.58"/>
  <circle cx="22"  cy="460" r="1.0" fill="#FFFFFF"  opacity="0.52"/>
  <circle cx="545" cy="450" r="0.9" fill="#F5E6A0" opacity="0.55"/>
  <circle cx="55"  cy="600" r="0.8" fill="#C8C0E8" opacity="0.48"/>
  <circle cx="540" cy="620" r="1.0" fill="#FFFFFF"  opacity="0.45"/>

  <!-- Small/dim stars -->
  <circle cx="112" cy="38"  r="0.6" fill="#FFFFFF"  opacity="0.55"/>
  <circle cx="228" cy="18"  r="0.5" fill="#C8C0E8" opacity="0.60"/>
  <circle cx="418" cy="22"  r="0.6" fill="#FFFFFF"  opacity="0.52"/>
  <circle cx="470" cy="68"  r="0.5" fill="#F5E6A0" opacity="0.58"/>
  <circle cx="540" cy="62"  r="0.6" fill="#C8C0E8" opacity="0.55"/>
  <circle cx="16"  cy="138" r="0.5" fill="#FFFFFF"  opacity="0.48"/>
  <circle cx="540" cy="172" r="0.6" fill="#F5E6A0" opacity="0.50"/>
  <circle cx="15"  cy="360" r="0.5" fill="#C8C0E8" opacity="0.45"/>
  <circle cx="545" cy="340" r="0.6" fill="#FFFFFF"  opacity="0.48"/>
  <circle cx="18"  cy="500" r="0.5" fill="#F5E6A0" opacity="0.42"/>
  <circle cx="548" cy="500" r="0.6" fill="#C8C0E8" opacity="0.44"/>
  <circle cx="120" cy="640" r="0.5" fill="#FFFFFF"  opacity="0.40"/>
  <circle cx="395" cy="648" r="0.6" fill="#F5E6A0" opacity="0.38"/>

  <!-- Cross/sparkle stars (4-point) -->
  <!-- Sparkle at top right -->
  <g transform="translate(430,42)" opacity="0.80">
    <line x1="0" y1="-5" x2="0" y2="5"  stroke="#F5E6A0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-5" y1="0" x2="5" y2="0"  stroke="#F5E6A0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="#F5E6A0" stroke-width="0.4" stroke-linecap="round"/>
    <line x1="2.5" y1="-2.5" x2="-2.5" y2="2.5" stroke="#F5E6A0" stroke-width="0.4" stroke-linecap="round"/>
  </g>
  <!-- Sparkle near phone -->
  <g transform="translate(150,300)" opacity="0.60">
    <line x1="0" y1="-4" x2="0" y2="4"  stroke="#C8C0E8" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="-4" y1="0" x2="4" y2="0"  stroke="#C8C0E8" stroke-width="0.7" stroke-linecap="round"/>
  </g>
  <!-- Sparkle top left area -->
  <g transform="translate(58,55)" opacity="0.70">
    <line x1="0" y1="-4.5" x2="0" y2="4.5" stroke="#F5E6A0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-4.5" y1="0" x2="4.5" y2="0" stroke="#F5E6A0" stroke-width="0.8" stroke-linecap="round"/>
    <line x1="-2" y1="-2" x2="2" y2="2"    stroke="#F5E6A0" stroke-width="0.4" stroke-linecap="round"/>
    <line x1="2" y1="-2" x2="-2" y2="2"    stroke="#F5E6A0" stroke-width="0.4" stroke-linecap="round"/>
  </g>

  <!-- Moon glow halo -->
  <circle cx="95" cy="115" r="140" fill="url(#moonGlow)"/>

  <!-- Crescent moon -->
  <circle cx="95" cy="115" r="72" fill="url(#moonFace)" mask="url(#crescentMask)"/>

  <!-- Moon subtle surface dots -->
  <circle cx="68" cy="105" r="5" fill="#C8973A" opacity="0.12"/>
  <circle cx="80" cy="128" r="8" fill="#C8973A" opacity="0.10"/>
  <circle cx="55" cy="130" r="4" fill="#C8973A" opacity="0.08"/>

  <!-- Phone ambient glow -->
  <ellipse cx="280" cy="380" rx="185" ry="200" fill="url(#phoneGlow)"/>

  <!-- Phone shadow/depth -->
  <rect x="162" y="148" width="236" height="476" rx="38" fill="#080610" opacity="0.6"/>

  <!-- Phone body -->
  <rect x="160" y="140" width="240" height="476" rx="38" fill="#1C1930" stroke="#2E2A50" stroke-width="1.5"/>

  <!-- Side buttons (volume) -->
  <rect x="156" y="220" width="4" height="28" rx="2" fill="#252240" opacity="0.8"/>
  <rect x="156" y="260" width="4" height="28" rx="2" fill="#252240" opacity="0.8"/>
  <!-- Power button -->
  <rect x="400" y="235" width="4" height="42" rx="2" fill="#252240" opacity="0.8"/>

  <!-- Screen bezel -->
  <rect x="168" y="152" width="224" height="452" rx="30" fill="#0D0B14"/>

  <!-- Dynamic Island pill -->
  <rect x="246" y="162" width="68" height="22" rx="11" fill="#080610"/>

  <!-- SCREEN CONTENT (clipped to screen area) -->
  <g clip-path="url(#screenClip)">
    <!-- Screen background -->
    <rect x="172" y="142" width="216" height="456" fill="#0D0B14"/>

    <!-- AI disclaimer pill -->
    <rect x="214" y="210" width="132" height="22" rx="11" fill="#16132A"/>
    <text x="280" y="225" text-anchor="middle" fill="#7A7087" font-family="-apple-system, sans-serif" font-size="9.5">✦ AI Generated Story</text>

    <!-- Learning value pill -->
    <rect x="223" y="240" width="114" height="20" rx="10" fill="#1E2A1E"/>
    <text x="280" y="254" text-anchor="middle" fill="#7AC49A" font-family="-apple-system, sans-serif" font-size="9">🌿 Resilience</text>

    <!-- Story title -->
    <text x="280" y="286" text-anchor="middle" fill="#F0EDE6" font-family="Georgia, serif" font-size="17" font-weight="600">The Starlight Fox</text>

    <!-- Separator star -->
    <text x="280" y="308" text-anchor="middle" fill="#E8A95C" font-family="-apple-system, sans-serif" font-size="13">✦</text>

    <!-- Story body text (lines) -->
    <rect x="192" y="322" width="176" height="7" rx="3.5" fill="#B8B0A8" opacity="0.45"/>
    <rect x="192" y="336" width="160" height="7" rx="3.5" fill="#B8B0A8" opacity="0.40"/>
    <rect x="192" y="350" width="172" height="7" rx="3.5" fill="#B8B0A8" opacity="0.43"/>
    <rect x="192" y="364" width="148" height="7" rx="3.5" fill="#B8B0A8" opacity="0.38"/>

    <rect x="192" y="386" width="168" height="7" rx="3.5" fill="#B8B0A8" opacity="0.38"/>
    <rect x="192" y="400" width="155" height="7" rx="3.5" fill="#B8B0A8" opacity="0.35"/>
    <rect x="192" y="414" width="176" height="7" rx="3.5" fill="#B8B0A8" opacity="0.36"/>
    <rect x="192" y="428" width="130" height="7" rx="3.5" fill="#B8B0A8" opacity="0.32"/>

    <rect x="192" y="450" width="163" height="7" rx="3.5" fill="#B8B0A8" opacity="0.28"/>
    <rect x="192" y="464" width="145" height="7" rx="3.5" fill="#B8B0A8" opacity="0.24"/>
    <rect x="192" y="478" width="170" height="7" rx="3.5" fill="#B8B0A8" opacity="0.20"/>

    <!-- Bottom fade -->
    <rect x="172" y="490" width="216" height="108" fill="url(#screenFade)"/>
  </g>

  <!-- Screen glass reflection -->
  <rect x="168" y="152" width="224" height="452" rx="30"
        fill="none" stroke="url(#glassReflect)" stroke-width="0.5" opacity="0.4"/>

  <!-- Small decorative stars near phone -->
  <circle cx="148" cy="220" r="1.2" fill="#F5E6A0" opacity="0.60"/>
  <circle cx="420" cy="185" r="1.0" fill="#C8C0E8" opacity="0.55"/>
  <circle cx="140" cy="520" r="0.8" fill="#F5E6A0" opacity="0.45"/>
  <circle cx="425" cy="490" r="1.0" fill="#C8C0E8" opacity="0.50"/>

  <!-- Bottom hill silhouette (gentle) -->
  <ellipse cx="280" cy="680" rx="350" ry="60" fill="#0A0816" opacity="0.8"/>
</svg>
